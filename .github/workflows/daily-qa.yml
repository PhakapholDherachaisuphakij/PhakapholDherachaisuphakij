name: Daily GitHub Streak & QA Health Check

on:
  schedule:
    - cron: '0 0 * * *' # 07:00 น. เวลาไทย
  workflow_dispatch:

jobs:
  qa-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Robot Framework
      run: |
        pip install robotframework robotframework-seleniumlibrary

    - name: Execute Tests
      run: |
        # สร้างโฟลเดอร์พักไฟล์
        mkdir -p qa-reports
        # ลบไฟล์ภาพเก่าออกให้หมดเพื่อความสะอาด (จะไม่สะสมจนรก)
        rm -f qa-reports/*.png
        # รันสคริปต์ (ใช้ || true เพื่อให้ Workflow เดินหน้าต่อแม้เทสต์จะ FAIL)
        robot -d qa-reports tests/health_check.robot || true
        # สร้างไฟล์สถานะเพื่อบังคับให้เกิดการ Commit ทุกวัน
        echo "Check Date: $(date)" > qa-reports/status.txt

    - name: Commit and Push to Profile
      run: |
        # ตั้งค่าตัวตนให้เป็นคุณ Phakaphol เพื่อเอา Streak
        git config --local user.email "pkdhera9@gmail.com"
        git config --local user.name "PhakapholDherachaisuphakij"
        
        # เพิ่มไฟล์เข้า Git (ใช้ชื่อโฟลเดอร์เพื่อกัน Error 128)
        git add qa-reports/
        
        # ทำการ Commit พร้อมระบุเวลา (เพื่อให้ Message ไม่ซ้ำกันในแต่ละวัน)
        git commit -m "chore(qa): update health check report $(date +'%Y-%m-%d %H:%M') [skip ci]" || echo "No changes"
        
        # Push กลับไปที่ GitHub
        git push