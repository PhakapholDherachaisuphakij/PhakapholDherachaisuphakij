name: Daily QA Health Check

on:
  schedule:
    # รันอัตโนมัติทุกวันเวลา 09:00 น. เวลาไทย (UTC+7)
    - cron: '0 2 * * *' 
  workflow_dispatch: 

jobs:
  ui-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install robotframework robotframework-seleniumlibrary

    - name: Run Robot Framework Tests
      run: |
        # รันเทสต์และเก็บไฟล์ผลลัพธ์ไว้ในโฟลเดอร์ qa-reports
        robot -d qa-reports tests/health_check.robot

    - name: Commit and Push Test Reports
      if: always() # สั่งให้ทำงานเสมอแม้ว่าเทสต์จะพัง เพื่อให้มี log เก็บไว้
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add ไฟล์ report ที่ robot สร้างขึ้น
        git add qa-reports/
        
        # ใช้ [skip ci] เพื่อป้องกันไม่ให้ Action รันซ้อนกันเองจากการ Commit นี้
        git commit -m "QA Auto-Update: Daily Health Check Report [skip ci]" || echo "No changes to commit"
        git push