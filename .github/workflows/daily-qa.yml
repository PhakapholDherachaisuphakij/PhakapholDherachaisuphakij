name: Daily GitHub Streak & QA Health Check

on:
  schedule:
    - cron: '0 0 * * *' # 07:00 น. เวลาไทย
  workflow_dispatch:

jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install robotframework robotframework-seleniumlibrary

    - name: Run Robot Framework & Manage Assets
      run: |
        # สร้างโฟลเดอร์ถ้ายังไม่มี
        mkdir -p qa-reports
        
        # ลบ screenshot เดิมทิ้งก่อนรัน เพื่อไม่ให้สะสมจนรก
        rm -f qa-reports/*.png
        
        # รันเทสต์
        robot -d qa-reports tests/health_check.robot || echo "Tests failed but continuing to commit"
        
        # สร้าง timestamp เพื่อให้เกิดการ Commit แน่นอน
        echo "Last QA Check: $(date)" > qa-reports/status.txt

    - name: Commit and Push
      run: |
        git config --local user.email "pkdhera9@gmail.com"
        git config --local user.name "PhakapholDherachaisuphakij"
        
        # Add เฉพาะไฟล์ที่จำเป็น
        git add qa-reports/latest_homepage.png qa-reports/latest_ranking.png qa-reports/status.txt
        
        # บังคับ Commit แม้ไฟล์ภาพจะชื่อเดิม แต่เนื้อหาใน status.txt จะเปลี่ยนทุกวัน
        git commit -m "chore(qa): daily health check $(date +'%Y-%m-%d') [skip ci]" || echo "No changes"
        
        git push